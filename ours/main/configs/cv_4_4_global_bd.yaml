extra_prepare_dict:
    extra_qconfig_dict:
        w_observer: MSEObserver
        a_observer: EMAMSEObserver
        w_fakequantize: AdaRoundFakeQuantize
        a_fakequantize: FixedFakeQuantize
        w_qscheme:
            bit: 4
            symmetry: False
            per_channel: True
            pot_scale: False
        a_qscheme:
            bit: 4
            symmetry: False
            per_channel: False
            pot_scale: False

quantize:
    quantize_type: global_rounding_attack
    cali_batchsize: 16
    attack:
        bd_target: 0
        candidate_ratio: 0.10
        gate_init: 4.0
        steps: 5000
        lr: 0.02
        margin: 5.0
        temperature: 1.0
        kl_temperature: 1.0
        clean_margin_weight: 0.5
        clean_margin_cap: 2.0
        clean_epsilon: 0.015
        flip_budget: 0.03
        dual_clean_init: 1.0
        dual_lr_clean: 0.05
        rho_clean: 20.0
        aug_pad: 4
        hflip_prob: 0.5
        grad_clip: 5.0
        eval_interval: 250
        diagnostic_test_eval: true
        diagnostic_test_interval: 500
        best_max_clean_kl: 0.03
        best_min_clean_agreement: 99.0
        diagnostic_budget_sweep:
            - 0.005
            - 0.010
            - 0.015
            - 0.020
            - 0.025
            - 0.030

dataset:
    batch_size: 32
    num_workers: 16
    pattern: stage2

process:
    seed: 1005
