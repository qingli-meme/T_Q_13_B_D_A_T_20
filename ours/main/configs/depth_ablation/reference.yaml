extra_prepare_dict:
    extra_qconfig_dict:
        w_observer: MSEObserver
        a_observer: EMAMSEObserver
        w_fakequantize: StructuredRoundFakeQuantize
        a_fakequantize: FixedFakeQuantize
        w_qscheme:
            bit: 4
            symmetry: False
            per_channel: True
            pot_scale: False
        a_qscheme:
            bit: 4
            symmetry: False
            per_channel: False
            pot_scale: False
quantize:
    quantize_type: minimum_transport_depth_ablation
    cali_batchsize: 16
    attack:
        bd_target: 0
        variant_name: "reference"
        depth_variant: "reference"
        semantic_module: view_post_act_fake_quantizer
        classifier_module: linear
        decision_svd_tol: 1.0e-6
        geometry_logit_tolerance: 1.0e-4
        steps: 5000
        lr: 0.01
        grad_clip: 5.0
        aug_pad: 4
        hflip_prob: 0.5
        eval_interval: 250
dataset:
    batch_size: 32
    num_workers: 16
    pattern: stage2
process:
    seed: 1005
