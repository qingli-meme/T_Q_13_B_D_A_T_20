extra_prepare_dict:
    extra_qconfig_dict:
        w_observer: MSEObserver
        a_observer: EMAMSEObserver
        w_fakequantize: StructuredRoundFakeQuantize
        a_fakequantize: FixedFakeQuantize
        w_qscheme:
            bit: 4
            symmetry: False
            per_channel: True
            pot_scale: False
        a_qscheme:
            bit: 4
            symmetry: False
            per_channel: False
            pot_scale: False

quantize:
    quantize_type: reconstruction_ce_direct_rounding
    cali_batchsize: 2
    attack:
        bd_target: 0
        variant_name: "target_init_joint_smoke"
        freeze_classifier: false
        classifier_module: linear
        backdoor_weight: 128.0
        steps: 20
        lr: 0.01
        trigger_lr: 0.0005
        grad_clip: 5.0
        trigger_grad_clip: 5.0
        aug_pad: 4
        hflip_prob: 0.5
        eval_interval: 5

dataset:
    batch_size: 32
    num_workers: 16
    pattern: stage2
    trigger_mode: qura_optimized
    trigger_size: 6

process:
    seed: 1005
