extra_prepare_dict:
    extra_qconfig_dict:
        w_observer: MSEObserver
        a_observer: EMAMSEObserver
        w_fakequantize: StructuredRoundFakeQuantize
        a_fakequantize: FixedFakeQuantize
        w_qscheme:
            bit: 4
            symmetry: False
            per_channel: True
            pot_scale: False
        a_qscheme:
            bit: 4
            symmetry: False
            per_channel: False
            pot_scale: False

quantize:
    quantize_type: reconstruction_ce_direct_rounding
    cali_batchsize: 16
    attack:
        bd_target: 0
        variant_name: "ptq_init_joint_all_weights_a128"
        freeze_classifier: false
        classifier_module: linear
        backdoor_weight: 128.0
        steps: 5000
        lr: 0.01
        trigger_lr: 0.0005
        grad_clip: 5.0
        trigger_grad_clip: 5.0
        aug_pad: 4
        hflip_prob: 0.5
        eval_interval: 250

# Stage A: ordinary target CE on a fixed benign W4A4 PTQ probe model.
# No rounding variable is initialized or optimized in this stage.
trigger_init:
    trigger_size: 6
    init_value: 0.5
    epochs: 100
    lr: 0.002
    log_interval: 10

dataset:
    batch_size: 32
    num_workers: 16
    pattern: stage2
    # Placeholder only. Runner replaces this patch with 0.5 before Stage-A
    # calibration, and with the learned PTQ initialization before Stage B.
    trigger_mode: badnet_white
    trigger_size: 6

process:
    seed: 1005
