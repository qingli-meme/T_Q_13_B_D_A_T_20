extra_prepare_dict:
    extra_qconfig_dict:
        w_observer: MSEObserver
        a_observer: EMAMSEObserver
        w_fakequantize: StructuredRoundFakeQuantize
        a_fakequantize: FixedFakeQuantize
        w_qscheme:
            bit: 4
            symmetry: False
            per_channel: True
            pot_scale: False
        a_qscheme:
            bit: 4
            symmetry: False
            per_channel: False
            pot_scale: False

quantize:
    quantize_type: reconstruction_ce_direct_rounding
    cali_batchsize: 16
    attack:
        bd_target: 0
        variant_name: "legal_family_trigger_6x6_all_weights_a128"
        freeze_classifier: false
        classifier_module: linear
        backdoor_weight: 128.0
        steps: 5000
        lr: 0.01
        grad_clip: 5.0
        aug_pad: 4
        hflip_prob: 0.5
        eval_interval: 250

# Trigger is learned on a temporary quantized probe model.
# The only trainable variable in this stage is the 6x6 trigger tensor.
trigger_train:
    trigger_size: 6
    epochs: 100
    lr: 0.002
    states_per_batch: 4
    flip_prob_min: 0.0
    flip_prob_max: 0.15
    init_value: 0.5
    grad_clip: 5.0
    log_interval: 10

dataset:
    batch_size: 32
    num_workers: 16
    pattern: stage2
    # Temporary same-shape placeholder only. The runner replaces it with the
    # learned trigger before the final FP/PTQ/attack evaluation.
    trigger_mode: badnet_white
    trigger_size: 6

process:
    seed: 1005
